<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastrear Pedido — Alpha Max Suplementos</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Arial, sans-serif; background: #f4f4f6; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 16px 20px; display: flex; align-items: center; gap: 16px; }
    header img { height: 44px; object-fit: contain; }
    header h1 { font-size: 18px; font-weight: 700; color: #111; }
    .container { max-width: 540px; margin: 40px auto; padding: 0 20px; width: 100%; }
    .card { background: #fff; border-radius: 16px; padding: 28px; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
    h2 { font-size: 20px; font-weight: 800; color: #111; margin-bottom: 6px; }
    .sub { font-size: 13px; color: #888; margin-bottom: 24px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 6px; }
    input { width: 100%; padding: 12px 14px; border: 1.5px solid #e5e7eb; border-radius: 10px; font-size: 15px; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #e53935; }
    button { width: 100%; padding: 14px; background: #e53935; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 12px; transition: background 0.15s; }
    button:hover { background: #c62828; }
    .result { margin-top: 24px; display: flex; flex-direction: column; gap: 14px; }
    .pedido-card { border: 1.5px solid #e5e7eb; border-radius: 12px; padding: 16px; }
    .pedido-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .pedido-data { font-size: 12px; color: #888; }
    .pedido-total { font-size: 16px; font-weight: 800; color: #e53935; }
    .pedido-itens { font-size: 13px; color: #555; line-height: 1.8; margin-bottom: 10px; }
    .pedido-endereco { font-size: 12px; color: #888; margin-bottom: 12px; }
    .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .s-aguardando { background: #fef9c3; color: #854d0e; }
    .s-confirmado  { background: #dbeafe; color: #1d4ed8; }
    .s-enviado     { background: #dcfce7; color: #15803d; }
    .s-cancelado   { background: #fee2e2; color: #dc2626; }
    .empty { text-align: center; padding: 40px 0; color: #888; }
    .steps { display: flex; gap: 0; margin-bottom: 14px; }
    .step { flex: 1; text-align: center; position: relative; }
    .step::before { content: ''; position: absolute; top: 14px; left: 50%; right: -50%; height: 2px; background: #e5e7eb; z-index: 0; }
    .step:last-child::before { display: none; }
    .step-dot { width: 28px; height: 28px; border-radius: 50%; background: #e5e7eb; display: flex; align-items: center; justify-content: center; margin: 0 auto 4px; font-size: 13px; position: relative; z-index: 1; }
    .step.done .step-dot { background: #22c55e; color: #fff; }
    .step.active .step-dot { background: #e53935; color: #fff; }
    .step-label { font-size: 10px; color: #888; font-weight: 600; }
    footer { text-align: center; padding: 24px; font-size: 12px; color: #aaa; margin-top: auto; }
    footer a { color: #e53935; text-decoration: none; }
  </style>
</head>
<body>
<header>
  <a href="index.html"><img src="logo.png" alt="Alpha Max Suplementos"></a>
  <h1>Rastrear Pedido</h1>
</header>

<div class="container">
  <div class="card">
    <h2>Onde está meu pedido?</h2>
    <p class="sub">Digite seu telefone para consultar seus pedidos</p>
    <label>Telefone / WhatsApp</label>
    <input type="tel" id="input-tel" placeholder="(11) 99999-9999" oninput="this.value=this.value.replace(/\D/g,'').replace(/(\d{2})(\d)/,'($1) $2').replace(/(\d{5})(\d)/,'$1-$2').substring(0,15)">
    <button onclick="buscarPedidos()">Consultar</button>
    <div id="resultado" class="result"></div>
  </div>
</div>

<footer>
  <a href="index.html">← Voltar para a loja</a>
</footer>

<script>
const SUPABASE_URL = 'https://kefhuzwqfzkjcpavcamq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtlZmh1endxZnpramNwYXZjYW1xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzODA4NDcsImV4cCI6MjEwMTk1Njg0N30.cRsgIVcLfgfaeJQseWMqwrEuIgF7SydSEMsaYjcJROY';

const STATUS_STEPS = ['aguardando', 'confirmado', 'enviado'];
const STATUS_LABELS = { aguardando: 'Aguardando', confirmado: 'Confirmado', enviado: 'Enviado', cancelado: 'Cancelado' };
const STATUS_ICONS  = { aguardando: '⏳', confirmado: '✅', enviado: '🚀', cancelado: '❌' };

function stepsHTML(status) {
  if (status === 'cancelado') return '<div style="color:#dc2626;font-weight:700;font-size:13px;">❌ Pedido cancelado</div>';
  const idx = STATUS_STEPS.indexOf(status);
  return `<div class="steps">${STATUS_STEPS.map((s, i) => `
    <div class="step ${i < idx ? 'done' : i === idx ? 'active' : ''}">
      <div class="step-dot">${i <= idx ? (i < idx ? '✓' : STATUS_ICONS[s]) : (i+1)}</div>
      <div class="step-label">${STATUS_LABELS[s]}</div>
    </div>
  `).join('')}</div>`;
}

async function buscarPedidos() {
  const raw = document.getElementById('input-tel').value;
  const tel = raw.replace(/\D/g,'').replace(/^0/,'').replace(/^55/,'');
  if (tel.length < 8) { alert('Digite um telefone válido.'); return; }
  const res = document.getElementById('resultado');
  res.innerHTML = '<div class="empty">Buscando...</div>';
  try {
    const r = await fetch(
      `${SUPABASE_URL}/rest/v1/pedidos_online?telefone=ilike.*${tel}*&order=created_at.desc&select=*`,
      { headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}` } }
    );
    const pedidos = await r.json();
    if (!Array.isArray(pedidos) || pedidos.length === 0) {
      res.innerHTML = '<div class="empty">Nenhum pedido encontrado para esse telefone.</div>';
      return;
    }
    res.innerHTML = pedidos.map(p => {
      const data = p.created_at ? new Date(p.created_at).toLocaleString('pt-BR') : '—';
      const itens = (p.itens_texto || '').split('\n').filter(Boolean).map(l => `<div>${l.replace(/^•\s*/,'')}</div>`).join('');
      const badge = `<span class="status-badge s-${p.status||'aguardando'}">${STATUS_LABELS[p.status||'aguardando']}</span>`;
      return `
        <div class="pedido-card">
          <div class="pedido-header">
            <div class="pedido-data">${data}</div>
            <div class="pedido-total">R$ ${Number(p.total||0).toFixed(2).replace('.',',')}</div>
          </div>
          ${stepsHTML(p.status || 'aguardando')}
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">${badge}</div>
          <div class="pedido-itens">${itens}</div>
          ${p.endereco ? `<div class="pedido-endereco">📦 ${p.endereco}</div>` : '<div class="pedido-endereco">🏪 Retirada na loja</div>'}
        </div>
      `;
    }).join('');
  } catch(e) {
    res.innerHTML = '<div class="empty">Erro ao buscar pedidos. Tente novamente.</div>';
  }
}

document.getElementById('input-tel').addEventListener('keydown', e => { if (e.key === 'Enter') buscarPedidos(); });
</script>
</body>
</html>
